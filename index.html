  <head>

    <!-- Web Performance: Pre-fetch & Preconnect -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />

    <!-- SEO Primary Tags -->

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pinpro.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pinpro.app/" />
    <meta property="og:title" content="PinPro Live | Conexión Instantánea con Profesionales Locales" />

    <!-- Twitter -->

    <meta property="twitter:image" content="https://pinpro.app/cover.png" />

    <script>
      // 1. SILENCIAR WARNINGS DE PERMISOS DE ANALÍTICAS EN CONSOLA
      const originalWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('Failed to log device analytics')) {
          // Absorbe el warning y no lo muestra para evitar saturar el log de desarrollo
          return;
        }
        originalWarn.apply(console, args);
      };

      // 2. CREAR UN MOCK DE ANALÍTICAS GLOBAL PARA EVITAR ERRORES DE INICIALIZACIÓN
      window.firebaseAnalytics = {
        logEvent: () => {},
        setCurrentScreen: () => {},
        setUserId: () => {}
      };
      window.deviceStatsInitialized = true; // Forzar bandera global
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PinPro Live",
        "url": "https://pinpro.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://pinpro.app/home?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }

    </script>
    <script type="application/ld+json">

        ]
      }
    </script>
  </head>
